<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <clipPath id="circle-clip-happy">
      <circle cx="100" cy="100" r="100"/>
    </clipPath>
  </defs>
  <g clip-path="url(#circle-clip-happy)">
    <!-- Background -->
    <rect width="200" height="200" fill="#f5f5f5"/>
    <!-- Neck -->
    <rect x="82" y="145" width="36" height="25" fill="#fde8d0" rx="4"/>
    <!-- Suit/Collar -->
    <path d="M60 160 L82 155 L90 175 L100 165 L110 175 L118 155 L140 160 L155 200 L45 200 Z" fill="#fff" stroke="#222" stroke-width="1.5"/>
    <!-- Tie -->
    <path d="M97 165 L103 165 L105 185 L100 190 L95 185 Z" fill="#222"/>
    <path d="M96 165 L100 160 L104 165 Z" fill="#333"/>
    <!-- Shirt collar lines -->
    <line x1="90" y1="175" x2="82" y2="155" stroke="#222" stroke-width="1.5"/>
    <line x1="110" y1="175" x2="118" y2="155" stroke="#222" stroke-width="1.5"/>
    <!-- Face -->
    <ellipse cx="100" cy="105" rx="50" ry="55" fill="#fde8d0"/>
    <!-- Ears -->
    <ellipse cx="50" cy="108" rx="8" ry="12" fill="#fde8d0" stroke="#e8c9a0" stroke-width="1"/>
    <ellipse cx="150" cy="108" rx="8" ry="12" fill="#fde8d0" stroke="#e8c9a0" stroke-width="1"/>
    <!-- Hair - messy black -->
    <path d="M45 95 C40 50, 55 20, 100 18 C145 20, 160 50, 155 95 L150 85 C148 60, 135 35, 100 30 C65 35, 52 60, 50 85 Z" fill="#1a1a1a"/>
    <!-- Messy hair strands -->
    <path d="M55 70 C50 40, 70 15, 100 12 C130 15, 150 40, 145 70" fill="#1a1a1a" stroke="none"/>
    <path d="M48 85 C42 55, 58 22, 95 16" fill="none" stroke="#1a1a1a" stroke-width="8" stroke-linecap="round"/>
    <path d="M152 85 C158 55, 142 22, 105 16" fill="none" stroke="#1a1a1a" stroke-width="8" stroke-linecap="round"/>
    <!-- Extra messy strands on top -->
    <path d="M70 30 C68 15, 80 8, 88 18" fill="#1a1a1a"/>
    <path d="M110 25 C115 10, 130 12, 128 28" fill="#1a1a1a"/>
    <path d="M85 22 C82 5, 95 0, 100 15" fill="#1a1a1a"/>
    <path d="M120 30 C125 15, 138 18, 135 35" fill="#1a1a1a"/>
    <path d="M60 45 C52 25, 65 12, 75 22" fill="#1a1a1a"/>
    <!-- Side hair -->
    <path d="M48 80 C42 90, 44 105, 52 110" fill="#1a1a1a"/>
    <path d="M152 80 C158 90, 156 105, 148 110" fill="#1a1a1a"/>
    <!-- Eyebrows - happy raised -->
    <path d="M68 88 Q78 82, 88 86" fill="none" stroke="#1a1a1a" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M112 86 Q122 82, 132 88" fill="none" stroke="#1a1a1a" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Eyes - happy squinting -->
    <path d="M70 98 Q80 92, 90 98" fill="none" stroke="#1a1a1a" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M110 98 Q120 92, 130 98" fill="none" stroke="#1a1a1a" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Glasses -->
    <rect x="63" y="88" width="32" height="22" rx="10" fill="none" stroke="#333" stroke-width="2.5"/>
    <rect x="105" y="88" width="32" height="22" rx="10" fill="none" stroke="#333" stroke-width="2.5"/>
    <line x1="95" y1="97" x2="105" y2="97" stroke="#333" stroke-width="2"/>
    <line x1="63" y1="97" x2="52" y2="95" stroke="#333" stroke-width="2"/>
    <line x1="137" y1="97" x2="148" y2="95" stroke="#333" stroke-width="2"/>
    <!-- Blush -->
    <ellipse cx="72" cy="112" rx="10" ry="5" fill="#ffccc0" opacity="0.4"/>
    <ellipse cx="128" cy="112" rx="10" ry="5" fill="#ffccc0" opacity="0.4"/>
    <!-- Mouth - big happy smile -->
    <path d="M82 120 Q100 140, 118 120" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.5"/>
    <path d="M85 120 Q100 135, 115 120" fill="#fff"/>
  </g>
</svg>
<title>Interview prep</title>
<style>
  :root { color-scheme: light dark; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         font:16px/1.5 system-ui, sans-serif; background:#f7f6f3; color:#1f2328; }
  .card { max-width:320px; padding:32px 28px; border:1px solid #d8d4cc; border-radius:16px;
          background:#fff; text-align:center; margin:16px; }
  h1 { font-size:17px; margin:0 0 4px; }
  p { font-size:13px; color:#6b7280; margin:0 0 20px; }
  input { width:100%; box-sizing:border-box; font-size:22px; text-align:center; letter-spacing:.4em;
          padding:12px 8px; border:1px solid #d8d4cc; border-radius:10px; background:transparent; color:inherit; }
  button { width:100%; min-height:48px; margin-top:12px; font-size:15px; font-weight:600;
           border:none; border-radius:10px; background:#1f6f6b; color:#fff; cursor:pointer; }
  .err { color:#b3261e; font-size:13px; min-height:18px; margin:10px 0 0; }
  @media (prefers-color-scheme: dark) {
    body { background:#16181d; color:#e6e1d7; }
    .card { background:#1f232b; border-color:#333842; }
    input { border-color:#333842; }
  }
</style>
</head>

    <button type="submit">Unlock</button>
  </form>

</div>

  async function open(key) {
    const html = await PrepCrypt.decrypt(key, PAYLOAD);
    await PrepCrypt.rememberKey(key);
    document.open();
    document.write(html);
    document.close();
  }
  // document.open() is silently ignored while the document is still being
  // parsed (write() would APPEND the decrypted page into the wrapper instead
  // of replacing it, leaving the gate styles active). Only auto-unlock after
  // the load event, when open() reliably replaces the document.
  async function tryStoredKey() {
    const key = await PrepCrypt.storedKey();
    if (key) { try { await open(key); } catch { sessionStorage.removeItem("prep-key-v1"); } }
  }
  if (document.readyState === "complete") tryStoredKey();
  else window.addEventListener("load", tryStoredKey);
  document.getElementById("gate").addEventListener("submit", async e => {
    e.preventDefault();
    const err = document.getElementById("err");
    err.textContent = "";
    try {
      await open(await PrepCrypt.deriveKey(document.getElementById("pin").value));
    } catch {
      err.textContent = "Wrong PIN.";
      document.getElementById("pin").select();
    }
  });
</script>

<style>
  :root { color-scheme: light dark; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;

  .card { max-width:320px; padding:32px 28px; border:1px solid #d8d4cc; border-radius:16px;

           border:none; border-radius:10px; background:#1f6f6b; color:#fff; cursor:pointer; }
  .err { color:#b3261e; font-size:13px; min-height:18px; margin:10px 0 0; }
  @media (prefers-color-scheme: dark) {
    body { background:#16181d; color:#e6e1d7; }
    .card { background:#1f232b; border-color:#333842; }
    input { border-color:#333842; }
  }
</style>

    const html = await PrepCrypt.decrypt(key, PAYLOAD);
    await PrepCrypt.rememberKey(key);

  // of replacing it, leaving the gate styles active). Only auto-unlock after
  // the load event, when open() reliably replaces the document.
  async function tryStoredKey() {
    const key = await PrepCrypt.storedKey();
    if (key) { try { await open(key); } catch { sessionStorage.removeItem("prep-key-v1"); } }
  }
  if (document.readyState === "complete") tryStoredKey();
  else window.addEventListener("load", tryStoredKey);
  document.getElementById("gate").addEventListener("submit", async e => {
    e.preventDefault();
    const err = document.getElementById("err");
    err.textContent = "";
    try {
      await open(await PrepCrypt.deriveKey(document.getElementById("pin").value));
    } catch {
      err.textContent = "Wrong PIN.";
      document.getElementById("pin").select();
    }
  });
</script>
</body>
</html>
